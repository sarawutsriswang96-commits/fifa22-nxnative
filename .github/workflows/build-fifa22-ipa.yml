name: Build FIFA 22 Shell IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct link to FIFA 22 (.nsp or .xci)'
        required: true
        type: string
      keys_url:
        description: 'Direct link to prod.keys'
        required: true
        type: string

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install xcodegen zstd glslang lz4 spirv-cross uv
          if [ -d "fifa-build-profile" ]; then
            cp -rn fifa-build-profile/* dm/games/ || true
          fi

      - name: Download game and keys
        run: |
          mkdir -p game_input
          curl -L --fail "${{ github.event.inputs.keys_url }}" -o prod.keys
          curl -L --fail "${{ github.event.inputs.game_url }}" -o game_input/fifa22.nsp

      - name: Build Shell IPA (App only)
        run: |
          mkdir -p out_ipa
          uv run scripts/build_ipa_from_nsp.py game_input --keys prod.keys --shell --allow-other-metal --out out_ipa/fifa22-shell.ipa || uv run scripts/build_ipa_from_nsp.py game_input --keys prod.keys --shell --allow-other-metal

      - name: Upload Shell IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa22-shell-ipa
          path: |
            out_ipa/*.ipa
            game_input/*.ipa
            *.ipa
